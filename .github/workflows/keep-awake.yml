# Keeps the free Render server awake so the site opens fast.
# Render's free plan puts the server to sleep after 15 minutes without visits; the next visitor then waits
# ~30-60 s while it starts. This job visits /api/health every 5 minutes (GitHub Actions is free for public
# repositories). One always-on free Render service uses ~730 of the 750 free hours a month.
# GitHub may run scheduled jobs a few minutes late; that's why it runs every 5 minutes, not every 14.
name: Keep the server awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the health page
        env:
          SITE: https://deadline-tracker-team-nexora.vercel.app
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 70 "$SITE/api/health" || true)
            echo "try $i: HTTP $code"; head -c 300 /tmp/h.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "The server didn't answer with 200 after 3 tries."; exit 1
