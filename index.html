  window.__dtBoot = { me: fetch("/api/me", o), state: fetch("/api/state", o) }; } catch (e) {} })();

<style>
/* Visual identity "Portale": white and near-black ink, soft grey glass, a pale steel-blue accent, Geist type.
   Dark theme: a neutral near-black (never navy) with the same steel light. Main buttons are ink pills. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:rgba(21,21,21,.04); --surface-3:#ececec;
  --ink:#151515; --ink-2:#3a3a3a; --muted:#646464; --line:rgba(21,21,21,.1);
  --steel:#99b6d2; --steel-ink:#46617a; --steel-soft:rgba(153,182,210,.22);
  --accent:#46617a; --accent-ink:#ffffff; --accent-2:#99b6d2; --accent-soft:rgba(153,182,210,.2); --blob-4:rgba(153,182,210,.14); --ease:cubic-bezier(.22,1,.36,1);
  --btn:#161616; --btn-ink:#ffffff;
  --glass-sheen:linear-gradient(160deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.2) 45%,rgba(255,255,255,.05) 100%);
  --teal:#23715d; --amber:#9a6a00; --coral:#c2412d;
  --side-bg:rgba(255,255,255,.66); --side-ink:#1d1d1d; --side-muted:#666666; --side-hover:rgba(21,21,21,.045); --side-active:rgba(21,21,21,.07); --side-active-ink:#151515;
  --ok:#1b8a55; --att:#946c00; --risk:#c4580a; --crit:#c2304f; --over:#bf281b;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.94); --glass-line:rgba(255,255,255,.95); --glass-edge:rgba(21,21,21,.08);
  --glass-shadow:0 1px 1px rgba(0,0,0,.03),0 12px 32px rgba(20,24,30,.07); --blur:blur(20px) saturate(140%);
  --blob-1:rgba(153,182,210,.26); --blob-2:rgba(238,196,170,.22); --blob-3:rgba(153,182,210,.16);
  --next-bg:linear-gradient(140deg,#151515 0%,#2b3238 100%);
  --font-display:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --r:16px; --r-sm:10px; --pill:100px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(20,24,30,.06);
  --shadow-lg:0 24px 64px rgba(20,24,30,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0e0f; --surface:#17181a; --surface-2:rgba(255,255,255,.05); --surface-3:rgba(255,255,255,.11);
    --ink:#f2f2f0; --ink-2:#d2d2cf; --muted:#a3a3a0; --line:rgba(255,255,255,.09);
    --steel:#99b6d2; --steel-ink:#b9cfe3; --steel-soft:rgba(153,182,210,.16);
    --accent:#99b6d2; --accent-ink:#0d0e0f; --accent-2:#c6d6e6; --accent-soft:rgba(153,182,210,.14); --blob-4:rgba(153,182,210,.06);
    --btn:#f2f2f0; --btn-ink:#121212;
    --glass-sheen:linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 100%);
    --teal:#5cc6a4; --amber:#fbbf4c; --coral:#ff7a6b;
    --side-bg:rgba(20,21,23,.7); --side-ink:#ececea; --side-muted:#a3a3a0; --side-hover:rgba(255,255,255,.05); --side-active:rgba(255,255,255,.09); --side-active-ink:#ffffff;
    --ok:#3ccf8e; --att:#e6bb3c; --risk:#ff9a3d; --crit:#ff5c93; --over:#ff6b5e;
    --glass:rgba(28,29,31,.62); --glass-strong:rgba(22,23,25,.94); --glass-line:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.08);
    --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 14px 36px rgba(0,0,0,.4);
    --blob-1:rgba(153,182,210,.1); --blob-2:rgba(214,140,100,.08); --blob-3:rgba(153,182,210,.06);
    --next-bg:linear-gradient(140deg,#1f2327 0%,#2d3a46 100%);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    --shadow-lg:0 24px 64px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0e0f; --surface:#17181a; --surface-2:rgba(255,255,255,.05); --surface-3:rgba(255,255,255,.11);
  --ink:#f2f2f0; --ink-2:#d2d2cf; --muted:#a3a3a0; --line:rgba(255,255,255,.09);
  --steel:#99b6d2; --steel-ink:#b9cfe3; --steel-soft:rgba(153,182,210,.16);
  --accent:#99b6d2; --accent-ink:#0d0e0f; --accent-2:#c6d6e6; --accent-soft:rgba(153,182,210,.14); --blob-4:rgba(153,182,210,.06);
  --btn:#f2f2f0; --btn-ink:#121212;
  --glass-sheen:linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 100%);
  --teal:#5cc6a4; --amber:#fbbf4c; --coral:#ff7a6b;
  --side-bg:rgba(20,21,23,.7); --side-ink:#ececea; --side-muted:#a3a3a0; --side-hover:rgba(255,255,255,.05); --side-active:rgba(255,255,255,.09); --side-active-ink:#ffffff;
  --ok:#3ccf8e; --att:#e6bb3c; --risk:#ff9a3d; --crit:#ff5c93; --over:#ff6b5e;
  --glass:rgba(28,29,31,.62); --glass-strong:rgba(22,23,25,.94); --glass-line:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.08);
  --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 14px 36px rgba(0,0,0,.4);
  --blob-1:rgba(153,182,210,.1); --blob-2:rgba(214,140,100,.08); --blob-3:rgba(153,182,210,.06);
  --next-bg:linear-gradient(140deg,#1f2327 0%,#2d3a46 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance;font-weight:650}
p{margin:0}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none !important}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:14px 12px;overflow-y:auto}
.ws-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--side-hover);border-radius:10px;padding:9px 10px;color:var(--side-ink);text-align:left}
.ws-btn:hover{background:var(--side-active)}
.ws-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);color:#fff;flex:none;font-size:15px}
.ws-btn .wn{font-weight:600;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-btn .wm{font-size:12px;color:var(--side-muted)}
.ws-btn .chev{margin-left:auto;color:var(--side-muted)}
.ws-menu{background:var(--side-active);border-radius:10px;padding:6px;display:grid;gap:2px}
.ws-menu button{border:0;background:transparent;color:var(--side-ink);display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-align:left}
.ws-menu button:hover,.ws-menu button[aria-current="true"]{background:var(--side-hover)}
.ws-menu .ws-ico{width:24px;height:24px;font-size:12px;border-radius:7px}
.nav{display:grid;gap:2px;margin-top:10px}
.nav-more summary{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--side-muted);font-weight:500;cursor:pointer;list-style:none}
.nav-more summary::-webkit-details-marker{display:none}
.nav-more summary svg{width:18px;height:18px}
.nav-more summary:hover{background:var(--side-hover)}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;font-size:11px;font-family:var(--font-mono);background:var(--crit);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.tagline{font-size:12px;color:var(--side-muted);padding:0 10px;line-height:1.4}
.viewas{background:var(--side-hover);border-radius:10px;padding:10px;display:grid;gap:6px;font-size:12px;color:var(--side-muted)}
.viewas select{background:var(--side-active);border-color:transparent;color:var(--side-ink);font-size:13px;padding:6px 8px}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:relative;z-index:5}
.crumb{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.crumb h1{font-size:20px;line-height:1.15}
.crumb span{font-size:12.5px;color:var(--muted)}
.gsearch{position:relative;width:min(280px,30vw)}
.gsearch input{width:100%;padding-left:32px;background:var(--surface)}
.gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--ink-2);padding:0}
.iconbtn:hover{border-color:var(--muted);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);font-family:var(--font-mono)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--over)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.65}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px dashed color-mix(in srgb,var(--att) 70%,transparent);color:var(--att);border-radius:999px;padding:3px 6px 3px 10px;background:color-mix(in srgb,var(--att) 8%,transparent)}
.demo-tag button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:0 4px;font-size:12px}
.view{flex:1;overflow-y:auto;padding:22px 24px 90px;scroll-behavior:smooth}
.view-inner{max-width:1240px;margin:0 auto;display:grid;gap:18px;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cards & common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{font-size:16px;margin-right:auto}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:grid;gap:18px;align-content:start;grid-template-columns:minmax(0,1fr)}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill{border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.pr-high{background:color-mix(in srgb,var(--over) 13%,transparent);color:var(--over)}
.pr-medium{background:color-mix(in srgb,var(--att) 16%,transparent);color:var(--att)}
.pr-low{background:var(--surface-2);color:var(--muted)}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px 2px 7px;background:color-mix(in srgb,var(--rc) 13%,transparent);color:var(--rc);white-space:nowrap;border:0}
.risk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rc)}
button.risk:hover{background:color-mix(in srgb,var(--rc) 22%,transparent)}
.lv-ontrack{--rc:var(--ok)} .lv-attention{--rc:var(--att)} .lv-risk{--rc:var(--risk)} .lv-critical{--rc:var(--crit)} .lv-overdue{--rc:var(--over)} .lv-done{--rc:var(--muted)}
.lv-critical.risk::before,.lv-overdue.risk::before{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rc) 60%,transparent)}50%{box-shadow:0 0 0 4px transparent}}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.avatar.lg{width:34px;height:34px;font-size:13px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{color:var(--ink);font-size:17px}
.empty svg{width:44px;height:44px;color:var(--surface-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-weight:550;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bar-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.note svg{width:14px;height:14px;flex:none;margin-top:2px}

/* ---------- Overview ---------- */
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h2{font-size:28px;line-height:1.1}
.hello p{color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px 12px;text-align:left;display:grid;gap:2px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--tone) 55%,var(--line));box-shadow:var(--shadow)}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.stat .l i{width:8px;height:8px;border-radius:2px;background:var(--tone)}
.stat .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1}
.stat .h{font-size:12px;color:var(--muted)}
.stat.alert .v{color:var(--tone)}
.next{position:relative;overflow:hidden;border-radius:16px;padding:20px 22px;background:var(--side-bg);color:#f6eee3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.next::after{content:"";position:absolute;inset:auto -60px -120px auto;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc,#e8a06a) 45%,transparent),transparent 65%);pointer-events:none}
.next .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#e2c6a8;display:flex;gap:8px;align-items:center}
.next h3{font-size:22px;margin:6px 0 6px;color:#fff}
.next p{color:#d0c3b2;max-width:62ch}
.next .acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.next .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
.next .btn:hover{background:rgba(255,255,255,.14)}
.next .btn.primary{background:#fff;color:#1d140c;border-color:#fff}
.next .risk{color:#fff;background:color-mix(in srgb,var(--rc) 55%,rgba(255,255,255,.08))}
.next .risk::before{background:#fff}
.radar-wrap{display:grid;grid-template-columns:minmax(0,1fr) 158px;gap:8px 14px;align-items:center}
.radar-wrap > .note{grid-column:1 / -1}
.radar{width:100%;max-width:300px;aspect-ratio:1;position:relative;justify-self:center}
.radar svg{width:100%;height:100%;overflow:visible}
.radar .ring{fill:none;stroke:var(--line)}
.radar .ringlbl{font-size:9.5px;fill:var(--muted);font-family:var(--font-mono)}
.radar .sector{stroke:var(--line);stroke-dasharray:2 4}
.radar .seclbl{font-size:10px;fill:var(--muted);font-weight:600}
.radar .sweep{fill:url(#sweepGrad)}
.radar .blip{cursor:pointer;transition:r .15s}
.radar .blip:hover{stroke:var(--ink);stroke-width:2}
.radar .halo{transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.radar-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;max-width:220px;transform:translate(-50%,calc(-100% - 10px));white-space:normal;z-index:3;box-shadow:var(--shadow)}
.legend{display:grid;gap:6px}
.legend button{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13.5px;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left}
.legend button:hover{background:var(--surface-2)}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.legend b{margin-left:auto;font-family:var(--font-mono);font-weight:600}
.legend .lt{font-weight:550}
.prio-list{display:grid}
.timeline{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.tl-day{display:grid;gap:4px;align-content:start;min-height:120px;padding:6px 3px;border-radius:8px;background:var(--surface-2);text-align:center}
.tl-day.today{background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.tl-day.wkend{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.tl-d{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);line-height:1.2}
.tl-d b{display:block;font-size:14px;color:var(--ink);font-family:var(--font-display)}
.tl-pip{display:block;height:20px;border-radius:5px;background:var(--c,var(--accent));border:0;padding:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 2px var(--surface-2)}
.tl-pip.lv-critical,.tl-pip.lv-overdue,.tl-pip.lv-risk{box-shadow:0 0 0 2px var(--rc)}
.tl-pip:hover{transform:scale(1.08)}
.load-bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px;position:relative}
.lb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.lb .stackb{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;position:relative;min-height:2px;background:var(--surface-2)}
.lb .stackb span{display:block;background:var(--c)}
.lb .cap{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.lb .lbl{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.lb .val{font-size:11px;font-family:var(--font-mono);color:var(--ink-2)}
.lb.over .val{color:var(--crit);font-weight:600}
.heads{display:grid;gap:8px}
.head{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--risk) 9%,transparent);border:1px solid color-mix(in srgb,var(--risk) 25%,transparent)}
.head svg{width:18px;height:18px;color:var(--risk);flex:none;margin-top:1px}
.head p{font-size:13.5px}
.head .row-flex{margin-top:6px}
.exam-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mini-exam{border-radius:10px;padding:10px 12px;background:var(--surface-2);border-left:4px solid var(--c);display:grid;gap:2px;text-align:left;border-top:0;border-right:0;border-bottom:0}
.mini-exam b{font-family:var(--font-mono);font-size:18px}
.mini-exam span{font-size:12px;color:var(--muted)}
.proj{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.proj:first-child{border-top:0;padding-top:0}
.proj .top{display:flex;gap:8px;align-items:center}
.proj .top b{font-weight:600;margin-right:auto}
.proj .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.feed{display:grid;gap:10px;font-size:13px}
.feed li{display:flex;gap:10px;list-style:none}
.feed ul{margin:0;padding:0;display:grid;gap:10px}
.feed time{font-size:11.5px;color:var(--muted);white-space:nowrap;font-family:var(--font-mono)}
.wl-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:7px 0}
.wl-row .who{display:flex;gap:8px;align-items:center;min-width:0}
.wl-row .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-bar{height:10px;border-radius:6px;background:var(--surface-2);position:relative;overflow:visible}
.wl-bar span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ok);transition:width .5s}
.wl-bar.warn span{background:var(--att)}
.wl-bar.over span{background:var(--crit)}
.wl-bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:1px}
.wl-row .v{font-family:var(--font-mono);font-size:12px;text-align:right}

/* ---------- Deadline list ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .search{position:relative;flex:1 1 220px}
.filters .search input{width:100%;padding-left:32px}
.filters .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ghead{display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--surface-2);font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;z-index:1}
.ghead i{width:8px;height:8px;border-radius:50%;background:var(--rc,var(--muted))}
.ghead .n{margin-left:auto;font-family:var(--font-mono)}
.item{display:grid;grid-template-columns:4px 42px minmax(0,1fr) auto auto;align-items:center;column-gap:10px;padding:10px 12px 10px 0;border-top:1px solid var(--line);position:relative;transition:background .15s}
.ghead + .item{border-top:0}
.item:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.item .edge{align-self:stretch;background:var(--rc,var(--muted));margin:-10px 0;border-radius:0 3px 3px 0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);background:transparent;display:grid;place-items:center;justify-self:center;padding:0;position:relative;transition:all .2s}
.check:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.check svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.4);transition:all .2s}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .check svg{opacity:1;transform:none}
.check.review{border-style:dashed;border-color:var(--accent)}
.item .body{min-width:0;display:grid;gap:4px;cursor:pointer;background:transparent;border:0;text-align:left;padding:2px 0}
.item .t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.item .m{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;font-size:12px;color:var(--muted)}
.item .due{text-align:right;display:grid;gap:1px;white-space:nowrap}
.cd{font-family:var(--font-mono);font-weight:600;font-size:13.5px}
.cd.lv-overdue,.cd.lv-critical{color:var(--rc)}
.abs{font-size:11.5px;color:var(--muted)}
.item .acts{display:flex;gap:2px;opacity:.75;transition:opacity .15s}
.item:hover .acts{opacity:1}
.ib{width:30px;height:30px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);padding:0}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.del:hover{color:var(--over)}
.ib svg{width:16px;height:16px}
.ring{--p:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0);display:inline-grid;place-items:center;flex:none}
.ring::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--surface)}
.ring.big{width:64px;height:64px}
.ring.big::after{width:50px;height:50px}
.ring-wrap{position:relative;display:inline-grid;place-items:center}
.ring-wrap span:not(.ring){position:absolute;font-family:var(--font-mono);font-size:13px;font-weight:600}
.pop{animation:popIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{0%{transform:scale(.6)}100%{transform:scale(1)}}
.burst{position:fixed;pointer-events:none;z-index:60}
.burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--c);animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* ---------- Exams ---------- */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.exam{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);align-content:start}
.exam .eh{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-top:4px solid var(--c)}
.exam .eh h3{font-size:17px}
.exam .eh p{font-size:12.5px;color:var(--muted);margin-top:2px}
.countdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 16px}
.countdown div{background:var(--surface-2);border-radius:9px;padding:8px 4px;text-align:center}
.countdown b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:600;line-height:1.1}
.countdown span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.topics{list-style:none;margin:0;padding:12px 16px 4px;display:grid;gap:5px}
.topics label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.topics input{accent-color:var(--accent);margin-top:3px}
.topics .dn{text-decoration:line-through;color:var(--muted)}
.exam .ef{padding:10px 16px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exam .ef input{flex:1 1 140px}

/* ---------- Calendar ---------- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-h h2{font-size:19px;margin-right:auto}
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:7px 10px;font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.mday{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .15s}
.mday:nth-child(7n){border-right:0}
.mday.out{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.mday.out .dn{color:var(--muted)}
.mday.drop{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.mday .dh{display:flex;align-items:center;justify-content:space-between}
.mday .dn{font-size:12.5px;font-weight:600;font-family:var(--font-mono);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mday.today .dn{background:var(--accent);color:var(--accent-ink)}
.mday .add{opacity:0;border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:6px;padding:0;font-size:16px;line-height:1}
.mday:hover .add{opacity:1}
.mday .add:hover{background:var(--surface-2);color:var(--ink)}
.ev{display:block;width:100%;box-sizing:border-box;font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);text-align:left;cursor:grab}
.ev.done{text-decoration:line-through;color:var(--muted);opacity:.7}
.ev.lv-critical,.ev.lv-overdue{box-shadow:inset 0 0 0 1px var(--rc)}
.ev.sess{border-left-style:dotted;background:transparent;color:var(--muted);cursor:default}
.more{font-size:11px;color:var(--muted);padding-left:4px;border:0;background:transparent;text-align:left}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wcol{border-right:1px solid var(--line);min-height:420px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol:last-child{border-right:0}
.wcol.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.wcol.drop{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.wcol h4{font-size:13px;font-family:var(--font-body);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.wcol h4 span{font-size:11px;color:var(--muted);font-family:var(--font-mono);font-weight:500}
.wcard{border-radius:8px;padding:7px 8px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));font-size:12.5px;display:grid;gap:3px;text-align:left;border-top:0;border-right:0;border-bottom:0;cursor:grab}
.wcard b{font-weight:600;overflow-wrap:anywhere}
.wcard span{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.wcard.sess{background:transparent;border-left-style:dotted;cursor:default}

/* ---------- Planner ---------- */
.plan-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start;min-height:220px}
.pday.today{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.pday .ph{display:flex;justify-content:space-between;align-items:baseline}
.pday .ph b{font-family:var(--font-display);font-size:15px}
.pday .ph span{font-size:11px;font-family:var(--font-mono);color:var(--muted)}
.pday.over .ph span{color:var(--crit);font-weight:600}
.cap-track{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.cap-track span{height:100%;background:var(--c)}
.sess{border-radius:8px;background:var(--surface-2);padding:7px 8px;display:grid;gap:4px;font-size:12.5px;border-left:3px solid var(--c)}
.sess b{font-weight:600;overflow-wrap:anywhere}
.sess .sm{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.sess .play{border:0;background:var(--surface);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;color:var(--accent);font-family:var(--font-body)}
.focus-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.focus-card > div{min-width:0}
#focusItem{flex:1 1 200px;min-width:0;width:0;max-width:100%}
.fring{width:132px;height:132px;position:relative}
.fring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fring circle{fill:none;stroke-width:9}
.fring .tr{stroke:var(--surface-2)}
.fring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.fring .tm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:24px;font-weight:600}
.focus-mini{position:fixed;right:20px;bottom:20px;background:var(--side-bg);color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);z-index:40;max-width:calc(100vw - 40px)}
.focus-mini .t{font-family:var(--font-mono);font-size:18px;font-weight:600}
.focus-mini .n{font-size:12px;color:#c7b9a6;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus-mini button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
.focus-mini .mr{width:34px;height:34px}
.focus-mini .mr svg{transform:rotate(-90deg)}

/* ---------- Board ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:360px;transition:background .15s,box-shadow .15s}
.col.drop{background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}
.col-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:2px 4px}
.col-h i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col-h b{margin-left:auto;font-family:var(--font-mono);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:grid;gap:7px;cursor:grab;text-align:left;transition:box-shadow .15s,transform .15s;position:relative}
.kcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.kcard.dragging{opacity:.4}
.kcard .kt{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.kcard .km{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.kcard .kf{display:flex;align-items:center;gap:8px;justify-content:space-between}
.kcard .ro{position:absolute;top:8px;right:8px;font-size:10.5px;color:var(--muted)}

/* ---------- Workload ---------- */
.heat{display:grid;grid-template-columns:160px repeat(14,minmax(26px,1fr));gap:3px;align-items:center;overflow-x:auto}
.heat .hd{font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--font-mono)}
.heat .who{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.heat .cell{height:30px;border-radius:5px;background:color-mix(in srgb,var(--accent) calc(var(--i)*100%),var(--surface-2));display:grid;place-items:center;font-size:10.5px;font-family:var(--font-mono);color:var(--ink-2)}
.heat .cell.over{background:color-mix(in srgb,var(--crit) 70%,var(--surface-2));color:#fff;font-weight:600}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.member{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);align-content:start;min-width:0}
.member .mh{display:flex;gap:10px;align-items:center;min-width:0}
.member .mh > .mono{flex:none}
.member .mh b{display:block}
.member .mh > div > span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;grid-template-columns:minmax(0,1fr)}
.member li{min-width:0}
.member li button{width:100%;display:flex;gap:8px;align-items:center;border:0;background:var(--surface-2);border-radius:7px;padding:6px 8px;font-size:12.5px;text-align:left}
.member li button > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member li button > :not(:first-child){flex:none}

/* ---------- Approvals ---------- */
.appr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.appr:first-child{border-top:0;padding-top:0}
.appr h4{font-size:15px;font-family:var(--font-body);font-weight:600}
.appr .ev-box{margin-top:8px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:4px}
.appr .ev-box a{color:var(--accent);overflow-wrap:anywhere}
.appr .acts{display:grid;gap:6px;justify-items:end}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:12px;color:var(--muted)}

/* ---------- Reports ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:28px;font-weight:700}
.kpi .h{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}
.chart .ax{font-size:10px;fill:var(--muted);font-family:var(--font-mono)}
.chart .bv{font-size:10px;fill:var(--ink-2);font-family:var(--font-mono)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-family:var(--font-mono)}
.tbl-wrap{overflow-x:auto}

/* ---------- Settings ---------- */
.set-sec[hidden]{display:none}
.set-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.set-nav{display:grid;gap:2px;position:sticky;top:0}
.set-nav button{padding:8px 10px;border-radius:8px;color:var(--ink-2);background:transparent;border:0;text-align:left;font-weight:500;font-size:13.5px;cursor:pointer}
.set-nav button:hover{background:var(--surface-2)}
.set-nav button[aria-selected=true]{background:var(--surface-2);color:var(--ink);font-weight:600}
.set-sec{display:grid;gap:14px;scroll-margin-top:10px;grid-template-columns:minmax(0,1fr)}
.set-sec h3{font-size:17px}
.set-sec > p{color:var(--muted);font-size:13px;margin-top:-8px}
.field{display:grid;gap:5px}
.field > label,.field > .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=url],.field select,.field textarea{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.toggle input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;border:0;padding:0;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px)}
.toggle input:disabled{opacity:.5;cursor:not-allowed}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips label{position:relative}
.daychips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.daychips span{display:grid;place-items:center;width:40px;height:34px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:550}
.daychips input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daychips input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;accent-color:var(--accent);padding:0;border:0;background:transparent;box-shadow:none}
.range output{font-family:var(--font-mono);font-weight:600;min-width:52px;text-align:right}
.int{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.chan{display:grid;gap:4px;margin:6px 0 14px}.chan .int .lg svg{width:17px;height:17px}.chan .int div{min-width:180px}.chan-h{margin:8px 0 2px;font-size:13px}.chan .ch-on{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.chan .f2{grid-template-columns:minmax(0,1fr)}}
.int:first-of-type{border-top:0}
.int .lg{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2);flex:none}
.int div{flex:1}
.int b{display:block;font-weight:600}
.int span{font-size:12.5px;color:var(--muted)}
.status-tag{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.status-tag.on{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.glist{display:grid;gap:6px}
.grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow input[type=text]{flex:1 1 140px;width:0}
.grow input[type=color]{width:38px;height:34px;padding:2px;border-radius:8px;cursor:pointer}
.grow input[type=number]{width:90px}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,12,24,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:31;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:16px 18px 0;display:grid;gap:10px}
.dr-top{display:flex;gap:8px;align-items:center}
.dr-top .sp{flex:1}
.dr-title{font-family:var(--font-display);font-size:21px;font-weight:650;border:1px solid transparent;background:transparent;padding:4px 6px;margin-left:-7px;border-radius:8px;width:calc(100% + 7px)}
.dr-title:hover{border-color:var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 10px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border-radius:999px;padding:0 6px;margin-left:4px}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px 20px;display:grid;gap:16px;align-content:start}
.dr-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.dr-f .sp{flex:1}
.why{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--rc) 9%,transparent);border:1px solid color-mix(in srgb,var(--rc) 28%,transparent);display:grid;gap:6px}
.why .wh{display:flex;align-items:center;gap:8px}
.why .wh b{color:var(--rc);font-size:14px}
.why ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:3px}
.why .tiny{font-size:11.5px;color:var(--muted)}
.ms{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ms li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface-2);border-radius:9px;padding:7px 8px 7px 10px}
.ms li.sug{background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line))}
.ms input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.ms .mt{font-size:13.5px;overflow-wrap:anywhere}
.ms .mt.dn{text-decoration:line-through;color:var(--muted)}
.ms .md{font-size:11px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}
.ms input[type=text]{padding:4px 6px;font-size:13px}
.ms input[type=number]{width:62px;padding:4px 6px;font-size:12.5px}
.ms input[type=date]{padding:4px 6px;font-size:12px}
.sug-box{border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface));padding:12px;display:grid;gap:10px}
.sug-box .sh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.sug-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:4px;padding:1px 6px}
.act-log{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.act-log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13px}
.act-log li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.act-log time{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.prog-row{display:flex;gap:12px;align-items:center}
.prog-row input[type=range]{flex:1;accent-color:var(--accent);padding:0;border:0;box-shadow:none;background:transparent}
.deps{display:flex;gap:6px;flex-wrap:wrap}
.dep{display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:4px 6px 4px 9px;background:var(--surface-2);font-size:12.5px}
.dep.open{background:color-mix(in srgb,var(--risk) 12%,transparent);color:var(--risk)}
.dep button{border:0;background:transparent;color:inherit;padding:0 3px;font-size:14px;line-height:1}

/* ---------- Modals ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:start center;padding:8vh 16px 16px;background:rgba(9,12,24,.5);opacity:0;pointer-events:none;transition:opacity .18s;overflow-y:auto}
.modal-wrap.on{opacity:1;pointer-events:auto}
.modal{width:min(640px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);transform:translateY(10px) scale(.98);transition:transform .2s;overflow:hidden}
.modal-wrap.on .modal{transform:none}
.modal.wide{width:min(760px,100%)}
.m-h{padding:16px 20px 0;display:flex;align-items:center;gap:10px}
.m-h h2{font-size:20px;margin-right:auto}
.m-b{padding:16px 20px;display:grid;gap:14px}
.m-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.m-f .sp{flex:1}
.qa-input{width:100%;font-size:18px;padding:14px 14px 14px 44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.qa-field{position:relative}
.qa-field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--accent)}
.parsed{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}
.ptok{display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:550;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);animation:tokIn .25s ease both}
.ptok.warn{background:color-mix(in srgb,var(--risk) 12%,transparent);border-color:color-mix(in srgb,var(--risk) 35%,transparent)}
.ptok .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@keyframes tokIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.examples button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.examples button:hover{border-color:var(--accent);color:var(--accent)}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) 150px 124px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.cand input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.cand .src{grid-column:2 / -1;font-size:11.5px;color:var(--muted);margin-top:-4px;font-style:italic}
.rescue-steps{display:grid;gap:12px}
.rstep{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.rstep .rh{display:flex;gap:10px;align-items:center}
.rstep .rh b{font-size:14.5px;margin-right:auto}
.rstep .rn{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--font-mono);flex:none}
.rstep.doneStep .rn{background:var(--ok);color:#fff}
.rstep p{font-size:13px;color:var(--muted)}
.notif{position:absolute;top:58px;right:24px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:20;overflow:hidden;animation:fadeUp .18s ease both}
.notif .nh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif .nh b{margin-right:auto}
.notif ul{list-style:none;margin:0;padding:0;max-height:420px;overflow-y:auto}
.notif li button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;width:100%;border:0;background:transparent;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.notif li button:hover{background:var(--surface-2)}
.notif li.unread button{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.notif li i{width:8px;height:8px;border-radius:50%;background:var(--rc,var(--accent));margin-top:6px}
.notif li span{font-size:13px}
.notif li time{display:block;font-size:11px;color:var(--muted);font-family:var(--font-mono)}

/* ---------- Onboarding ---------- */
.onb{position:fixed;inset:0;z-index:70;background:linear-gradient(155deg,#17110c 0%,#24170f 55%,#3a2316 100%);color:#f6eee3;display:grid;place-items:center;padding:24px;overflow-y:auto}
.onb::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 10%,rgba(232,160,106,.22),transparent 45%),radial-gradient(circle at 10% 90%,rgba(212,175,95,.12),transparent 40%);pointer-events:none}
/* logo */
.dt-logo{flex:none;display:block;border-radius:24%;box-shadow:0 4px 14px rgba(140,65,21,.3)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--side-ink)}
.m-brand{display:none}
.onb .brandline{font-weight:600}
@media (max-width:860px){.m-brand{display:flex;align-items:center;margin-right:10px}}
/* ---------- welcome page: landing + sign up / log in ---------- */
.onb.auth{place-items:start center;padding:clamp(18px,4vw,48px)}
.onb.auth::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 70% 40%,rgba(232,160,106,.16),transparent 70%);z-index:0}
.auth-wrap{position:relative;z-index:1;width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,460px);grid-template-areas:"landing card" "features card";column-gap:clamp(28px,5vw,72px);row-gap:20px;align-items:start;margin:auto 0}
.landing{grid-area:landing;display:grid;gap:16px;align-content:start;padding-top:8px;min-width:0}
.landing .brandline{font-size:15px;color:#efe5d7;font-weight:700;font-family:var(--font-display)}
.landing h1{font-size:clamp(34px,5.4vw,62px);line-height:1.02;letter-spacing:-.025em;margin:0;max-width:13ch}
.landing h1{perspective:900px;text-shadow:0 1px 0 #b5652b,0 2px 0 #9a5222,0 3px 0 #7f421b,0 4px 0 #653414,0 12px 26px rgba(15,8,3,.6)}
.landing h1 .grad{color:#fbbf4c;text-shadow:0 1px 0 #b98417,0 2px 0 #9d6e10,0 3px 0 #82590b,0 4px 0 #684506,0 12px 26px rgba(40,25,0,.55)}
/* 3D type, shared with the pitch: words flip up once */
.w3d{display:inline-block;transform-origin:50% 100%;animation:dtWordUp .9s cubic-bezier(.2,.75,.15,1) both;animation-delay:calc(var(--w) * 60ms + 120ms)}
@keyframes dtWordUp{from{opacity:0;transform:translateY(.35em) rotateX(-75deg)}to{opacity:1;transform:none}}
.landing p.lead{font-size:clamp(15px,1.5vw,18px);color:#d6c8b6;max-width:44ch;margin:0}
.features{grid-area:features;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-width:0}
.features li{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);transition:transform .2s,background .2s,border-color .2s}
.features li:hover{transform:translateY(-2px);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}
.features .fi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.features .fi svg{width:18px;height:18px}
.features b{display:block;font-size:14px;color:#fff;margin-bottom:2px}
.features span{font-size:12.5px;color:#c4b6a3;line-height:1.4}
/* 3D scene */
.hero3d{position:relative;height:clamp(270px,30vw,340px);perspective:1100px;margin-top:28px}
.hero3d .scene{--rx:12deg;--ry:-16deg;position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.hero3d .glow{position:absolute;left:18%;top:12%;width:62%;height:76%;border-radius:50%;background:radial-gradient(circle,rgba(232,160,106,.55),rgba(212,175,95,.2) 45%,transparent 70%);filter:blur(30px);transform:translateZ(-80px)}
.float-card{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;color:#f6eee3;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);
  box-shadow:0 24px 50px rgba(20,12,6,.45),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transform:translate3d(0,0,var(--z));animation:dtFloat 7s ease-in-out var(--d) infinite;will-change:transform}
@keyframes dtFloat{0%,100%{transform:translate3d(0,0,var(--z))}50%{transform:translate3d(0,-12px,var(--z))}}
.float-card b{display:block;font-size:14px}
.float-card small{display:block;font-size:12px;color:#d6c8b6}
.fc-task{left:4%;top:4%;width:min(300px,64%)}
.fc-dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.fc-chip{margin-left:auto;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}
.fc-chip.risk{background:rgba(255,138,92,.2);color:#ffc3a8;border:1px solid rgba(255,138,92,.45)}
.fc-ring{right:8%;top:16%}
.fc-ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.fc-ring circle{fill:none;stroke-width:5}
.fc-ring .trk{stroke:rgba(255,255,255,.15)}
.fc-ring .val{stroke:#f0b98a;stroke-linecap:round}
.fc-ring b{font-size:20px;font-family:var(--font-display)}
.fc-rem{left:14%;bottom:6%}
.fc-rem > svg{width:22px;height:22px;color:#ffd27a;flex:none}
.fc-todo{right:2%;bottom:16%;display:grid;gap:7px;min-width:190px}
.fc-line{display:flex;align-items:center;gap:8px;font-size:13px}
.fc-line i{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;flex:none}
.fc-line.done{color:#c4b6a3;text-decoration:line-through}
.fc-line.done i{background:#3ecf8e;border-color:#3ecf8e;color:#17110c}
.fc-line i svg{width:12px;height:12px;stroke-width:3}
/* glass panel */
.auth-card{grid-area:card;width:100%;position:relative;align-self:start;margin-top:clamp(0px,4vw,40px);
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:clamp(22px,3vw,34px);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 40px 90px rgba(15,8,3,.5),inset 0 1px 0 rgba(255,255,255,.22);animation:fadeUp .35s ease both}
.auth-card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(240,185,138,.7),transparent 40%,transparent 60%,rgba(212,175,95,.55));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.onb .auth-card h1{font-size:clamp(24px,3vw,32px);margin:0}
.auth-card p.lead{font-size:15px;margin:0}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(20,12,6,.35);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px;gap:4px}
.auth-tabs button{border:0;background:transparent;color:#d9cdbd;border-radius:10px;padding:10px;font-weight:600;min-height:42px;transition:background .2s,color .2s}
.auth-tabs button:hover{color:#fff}
.auth-tabs button[aria-selected="true"]{background:#fff;color:#1d140c;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.auth-form{display:grid;gap:14px}

/* ---------- Toast & mobile ---------- */

/* ---------- Glass layer (applies to both themes through the tokens above) ---------- */
body{transition:background-color .3s ease}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 34% at 12% 8%,var(--blob-1),transparent 70%),radial-gradient(34% 34% at 92% 88%,var(--blob-2),transparent 70%),radial-gradient(28% 28% at 78% 12%,var(--blob-3),transparent 70%)}
.card,.stat,.list,.cal,.kpi,.exam,.pday,.notif,.focus-card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-line)}

.bnav{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.next{background:var(--next-bg);border:1px solid rgba(255,255,255,.12);box-shadow:var(--glass-shadow)}
.ghead{background:var(--surface-2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* ---------- AI orb, hero and assistant ---------- */
.orb{--s:40px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-block;position:relative;
  background:conic-gradient(from 210deg,#e8a06a,#c8a25a,#ff7aa8,#ffb36b,#5ee7d0,#e8a06a);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 6px 22px rgba(232,160,106,.45)}
.orb::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 45%,transparent 70%)}
.orb.sm{--s:26px}.orb.lg{--s:64px}
.orb.spin{animation:orbspin 2.4s linear infinite}
@keyframes orbspin{to{transform:rotate(360deg)}}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:center;padding:24px 26px;border-radius:20px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 16%,var(--glass)),var(--glass) 55%,color-mix(in srgb,#c8a25a 14%,var(--glass)));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-line)}
.hero::after{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,#c8a25a 28%,transparent),transparent 65%);pointer-events:none}
.hero-main{display:grid;gap:6px;min-width:0;position:relative;z-index:1;grid-template-columns:minmax(0,1fr)}
.hero::before{content:"";position:absolute;width:300px;height:300px;left:-120px;bottom:-200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%);pointer-events:none}
.hero:has(.wk-stats){grid-template-columns:minmax(0,1fr) auto}
/* this week's numbers: small glass tiles with a little depth */
.wk-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(112px,1fr));gap:10px;perspective:800px}
.wk{display:grid;gap:2px;padding:12px 14px;border-radius:14px;text-decoration:none;color:var(--ink);
  background:linear-gradient(150deg,color-mix(in srgb,var(--surface) 88%,transparent),color-mix(in srgb,var(--surface) 60%,transparent));
  border:1px solid var(--glass-edge);box-shadow:0 1px 0 var(--glass-line) inset,0 8px 22px rgba(48,30,12,.08);
  transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s,border-color .2s}
.wk:hover{transform:translateY(-2px) rotateX(4deg);box-shadow:0 1px 0 var(--glass-line) inset,0 14px 30px rgba(48,30,12,.14);border-color:color-mix(in srgb,var(--kc) 45%,var(--glass-edge))}
.wk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wk b{font-size:26px;line-height:1;font-family:var(--font-display);color:var(--kc)}
.wk span{font-size:12.5px;color:var(--muted);font-weight:600}
.wk.zero b{color:var(--muted)}
.k-week{--kc:var(--accent)}.k-risk{--kc:var(--risk)}.k-over{--kc:var(--over)}.k-done{--kc:var(--ok)}
[data-theme="dark"] .wk{box-shadow:0 1px 0 var(--glass-line) inset,0 8px 22px rgba(0,0,0,.3)}
@media (max-width:1180px){.hero:has(.wk-stats){grid-template-columns:minmax(0,1fr)}.wk-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.wk-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wk{padding:10px 12px}.wk b{font-size:22px}}
/* Home cards: soft depth */

.dw-src svg{width:14px;height:14px;flex:none;margin-top:1px}
.dw-rate{display:inline-flex;gap:2px;margin-left:auto}
.dw-rate .ib{width:28px;height:28px;font-size:14px;filter:grayscale(1);opacity:.7}
.dw-rate .ib[aria-pressed="true"]{filter:none;opacity:1;background:var(--surface-2)}
.msg.unknown .bubble{border-style:dashed}
.dw-empty{margin:auto 0;display:grid;gap:8px;text-align:left;padding:6px 4px}
.dw-empty h3{margin:0;font-size:17px}.dw-empty p{margin:0;color:var(--muted);font-size:13.5px}
.dw-sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dw-sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;text-align:left;color:var(--ink)}
.dw-sugg button:hover{border-color:var(--accent)}
.dw-in{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid var(--line)}
.dw-in textarea{flex:1;resize:none;min-height:42px;max-height:140px;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35}
