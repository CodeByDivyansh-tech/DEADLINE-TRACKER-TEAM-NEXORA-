<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e0f" media="(prefers-color-scheme: dark)">
<title>Deadline Tracker — offline</title>
<style>
  :root{color-scheme:light dark;--bg:#ffffff;--ink:#151515;--muted:#646464;--btn:#161616;--btn-ink:#ffffff;--line:rgba(21,21,21,.1)}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0e0f;--ink:#f2f2f0;--muted:#a3a3a0;--btn:#f2f2f0;--btn-ink:#121212;--line:rgba(255,255,255,.09)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  main{max-width:380px;text-align:center;display:grid;gap:14px;justify-items:center;padding:32px 28px;border:1px solid var(--line);border-radius:22px}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0}
  p{margin:0;color:var(--muted);font-size:15px}
  a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:100px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:500;margin-top:6px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Deadline Tracker needs the internet to open your tasks. Your saved work is safe in your account.</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
